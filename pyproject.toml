[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dagnabbit"
version = "0.1.0"
description = "A NumPy/PyTorch port of dagnabbit-nim"
requires-python = ">=3.12.0,<3.13.0"
dependencies = [
    "torch>=2.12.0",
    "numpy>=2.1",
    # Compiles the random-graph generator, which feeds the training loop; see
    # dagnabbit/dag/generate.py.
    "numba>=0.61",
    "tensorboard>=2.18.0",
    "pytest>=8.0",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["dagnabbit*"]
